<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<title>GameNotif — Admin</title>
<style nonce="__NONCE__">
:root {
  color-scheme: dark light;
  --bg: #0b0d12;
  --bg-elev: #151922;
  --bg-elev-2: #1c2130;
  --border: #242a3a;
  --text: #e6e8ee;
  --text-dim: #8a93a6;
  --text-faint: #5a6478;
  --accent: #6aa1ff;
  --accent-soft: #6aa1ff22;
  --success: #5ed08f;
  --warning: #f5b85a;
  --danger: #f26b6b;
  --hot: #f26b6b;
  --warm: #f5b85a;
  --cold: #6aa1ff;
  --never: #8a93a6;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
button { font: inherit; cursor: pointer; }
input { font: inherit; }

/* Login screen */
.login-wrap {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.login-card {
  width: 100%;
  max-width: 380px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 28px;
  box-shadow: 0 24px 60px -24px #0008;
}
.login-card h1 {
  font-size: 22px;
  margin-bottom: 6px;
}
.login-card .sub {
  color: var(--text-dim);
  font-size: 14px;
  margin-bottom: 24px;
}
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
.field input:focus { border-color: var(--accent); }
.btn {
  width: 100%;
  padding: 12px 16px;
  background: var(--accent);
  color: #0b0d12;
  border: 0;
  border-radius: 10px;
  font-weight: 600;
  transition: transform .05s, opacity .15s;
}
.btn:hover { opacity: .92; }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.ghost {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 8px 14px;
  font-size: 13px;
  width: auto;
  font-weight: 500;
}
.btn.ghost:hover { color: var(--text); border-color: var(--text-dim); }
.error {
  margin-top: 12px;
  padding: 10px 12px;
  background: #f26b6b22;
  color: var(--danger);
  border-radius: 8px;
  font-size: 13px;
  display: none;
}
.error.show { display: block; }

/* Dashboard */
.app { display: none; }
.app.show { display: block; }
header.top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in oklab, var(--bg), transparent 8%);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
header.top h1 { font-size: 16px; }
header.top .meta {
  color: var(--text-faint);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
header.top .spacer { flex: 1; }
header.top .controls {
  display: flex;
  gap: 8px;
  align-items: center;
}
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  user-select: none;
}
.toggle input { accent-color: var(--accent); }

main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}
section { margin-bottom: 28px; }
section h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-faint);
  margin-bottom: 12px;
  font-weight: 600;
}
.grid {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
}
.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
}
.card .label {
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-bottom: 8px;
}
.card .value {
  font-size: 28px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.card .hint {
  font-size: 12px;
  color: var(--text-faint);
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}
.pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}
.tiers {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.tier {
  display: grid;
  grid-template-columns: 100px 1fr 60px;
  align-items: center;
  gap: 12px;
}
.tier .name {
  font-size: 13px;
  color: var(--text-dim);
  text-transform: capitalize;
}
.tier .bar {
  height: 8px;
  background: var(--bg-elev-2);
  border-radius: 4px;
  overflow: hidden;
}
.tier .bar > span {
  display: block;
  height: 100%;
  transition: width .4s ease;
}
.tier .bar > span.hot { background: var(--hot); }
.tier .bar > span.warm { background: var(--warm); }
.tier .bar > span.cold,
.tier .bar > span.cold_no_news { background: var(--cold); }
.tier .bar > span.never_checked { background: var(--never); }
.tier .count {
  font-variant-numeric: tabular-nums;
  text-align: right;
  color: var(--text);
  font-size: 13px;
}

.crons { display: grid; gap: 12px; }
.cron {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 16px;
  align-items: baseline;
}
.cron .name {
  font-weight: 600;
  letter-spacing: -0.01em;
}
.cron .interval {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  font-size: 12px;
  color: var(--text-faint);
}
.cron .status {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 999px;
  background: #5ed08f22;
  color: var(--success);
  justify-self: end;
}
.cron .status.locked {
  background: #f5b85a22;
  color: var(--warning);
}
.cron .status.failed {
  background: #f26b6b22;
  color: var(--danger);
}
.cron .timings {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-top: 6px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.cron .timing {
  font-size: 12px;
}
.cron .timing .k {
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-bottom: 2px;
}
.cron .timing .v {
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.loading {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-dim);
  padding: 40px 0;
  justify-content: center;
}
.spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f7f8fa;
    --bg-elev: #ffffff;
    --bg-elev-2: #f0f2f6;
    --border: #e3e6ec;
    --text: #1a1d24;
    --text-dim: #5a6378;
    --text-faint: #8a93a6;
  }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-view">
  <div class="login-card">
    <h1>GameNotif · Admin</h1>
    <p class="sub">Entrez votre mot de passe pour acceder au dashboard.</p>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        >
      </div>
      <button class="btn" type="submit" id="login-btn">Connexion</button>
      <div class="error" id="login-error" role="alert"></div>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div class="app" id="app-view">
  <header class="top">
    <h1>GameNotif · Admin</h1>
    <div class="spacer"></div>
    <div class="controls">
      <span class="meta" id="refresh-meta">—</span>
      <label class="toggle">
        <input type="checkbox" id="auto-refresh" checked>
        Auto 30s
      </label>
      <button class="btn ghost" id="refresh-btn" title="Rafraichir">↻</button>
      <button class="btn ghost" id="logout-btn">Deconnexion</button>
    </div>
  </header>

  <main id="dashboard">
    <div class="loading"><div class="spinner"></div>Chargement des stats…</div>
  </main>
</div>

<script nonce="__NONCE__">
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var loginView = $('login-view');
  var appView = $('app-view');
  var loginForm = $('login-form');
  var passwordInput = $('password');
  var loginBtn = $('login-btn');
  var loginError = $('login-error');
  var dashboard = $('dashboard');
  var refreshMeta = $('refresh-meta');
  var refreshBtn = $('refresh-btn');
  var logoutBtn = $('logout-btn');
  var autoRefreshBox = $('auto-refresh');

  var autoTimer = null;
  var AUTO_REFRESH_MS = 30 * 1000;

  // ── Login ─────────────────────────────────────────────────────────────────

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    loginError.classList.remove('show');
    loginBtn.disabled = true;
    loginBtn.textContent = 'Verification…';

    fetch('/admin/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: passwordInput.value }),
    })
      .then(function (r) {
        if (r.status === 204) {
          passwordInput.value = '';
          showDashboard();
          return;
        }
        return r.json().then(function (data) {
          throw new Error(data.message || 'Erreur de connexion');
        });
      })
      .catch(function (err) {
        loginError.textContent = err.message;
        loginError.classList.add('show');
      })
      .then(function () {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Connexion';
      });
  });

  // ── Logout ────────────────────────────────────────────────────────────────

  logoutBtn.addEventListener('click', function () {
    fetch('/admin/logout', { method: 'POST', credentials: 'same-origin' })
      .finally(function () {
        stopAutoRefresh();
        showLogin();
      });
  });

  // ── Dashboard ─────────────────────────────────────────────────────────────

  refreshBtn.addEventListener('click', function () { loadStats(); });

  autoRefreshBox.addEventListener('change', function () {
    if (autoRefreshBox.checked) startAutoRefresh();
    else stopAutoRefresh();
  });

  function startAutoRefresh() {
    stopAutoRefresh();
    autoTimer = setInterval(loadStats, AUTO_REFRESH_MS);
  }
  function stopAutoRefresh() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  }

  function showLogin() {
    appView.classList.remove('show');
    loginView.style.display = '';
    passwordInput.focus();
  }
  function showDashboard() {
    loginView.style.display = 'none';
    appView.classList.add('show');
    loadStats();
    if (autoRefreshBox.checked) startAutoRefresh();
  }

  function loadStats() {
    refreshBtn.disabled = true;
    fetch('/admin/stats', { credentials: 'same-origin' })
      .then(function (r) {
        if (r.status === 401) {
          stopAutoRefresh();
          showLogin();
          throw new Error('session expired');
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(renderStats)
      .catch(function (err) {
        if (err.message !== 'session expired') {
          dashboard.innerHTML = '';
          var p = document.createElement('p');
          p.className = 'loading';
          p.textContent = 'Erreur: ' + err.message;
          dashboard.appendChild(p);
        }
      })
      .then(function () { refreshBtn.disabled = false; });
  }

  // ── Rendering (textContent only, pas de innerHTML pour les valeurs) ───────

  function fmt(n) {
    return typeof n === 'number' ? n.toLocaleString('fr-FR') : '—';
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return d.toLocaleString('fr-FR', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      timeZone: 'Europe/Paris',
    });
  }
  function fmtRelative(iso) {
    if (!iso) return '—';
    var diff = new Date(iso).getTime() - Date.now();
    var abs = Math.abs(diff);
    var s = Math.round(abs / 1000);
    if (s < 60) return diff < 0 ? 'il y a ' + s + 's' : 'dans ' + s + 's';
    var m = Math.round(s / 60);
    if (m < 60) return diff < 0 ? 'il y a ' + m + 'min' : 'dans ' + m + 'min';
    var h = Math.round(m / 60);
    if (h < 24) return diff < 0 ? 'il y a ' + h + 'h' : 'dans ' + h + 'h';
    var j = Math.round(h / 24);
    return diff < 0 ? 'il y a ' + j + 'j' : 'dans ' + j + 'j';
  }

  function el(tag, opts) {
    var e = document.createElement(tag);
    if (opts) {
      if (opts.class) e.className = opts.class;
      if (opts.text != null) e.textContent = String(opts.text);
    }
    return e;
  }

  function card(label, value, hint) {
    var c = el('div', { class: 'card' });
    c.appendChild(el('div', { class: 'label', text: label }));
    c.appendChild(el('div', { class: 'value', text: fmt(value) }));
    if (hint) c.appendChild(el('div', { class: 'hint', text: hint }));
    return c;
  }

  function tierRow(name, count, total) {
    var pct = total > 0 ? (count / total) * 100 : 0;
    var row = el('div', { class: 'tier' });
    row.appendChild(el('div', { class: 'name', text: name.replace(/_/g, ' ') }));
    var bar = el('div', { class: 'bar' });
    var fill = el('span', { class: name });
    fill.style.width = pct.toFixed(1) + '%';
    bar.appendChild(fill);
    row.appendChild(bar);
    row.appendChild(el('div', { class: 'count', text: fmt(count) }));
    return row;
  }

  function cronCard(job) {
    var c = el('div', { class: 'cron' });
    c.appendChild(el('div', { class: 'name', text: job.name }));

    var status = 'idle';
    var statusText = 'OK';
    if (job.lockedAt) { status = 'locked'; statusText = 'En cours'; }
    else if (job.failCount > 0) { status = 'failed'; statusText = 'Echec ×' + job.failCount; }

    c.appendChild(el('div', { class: 'status ' + status, text: statusText }));
    c.appendChild(el('div', { class: 'interval', text: job.repeatInterval + ' · ' + (job.repeatTimezone || 'UTC') }));
    c.appendChild(el('div'));

    var timings = el('div', { class: 'timings' });
    [
      { k: 'Prochain', v: fmtDate(job.nextRunAt) + '  (' + fmtRelative(job.nextRunAt) + ')' },
      { k: 'Dernier', v: job.lastRunAt ? fmtDate(job.lastRunAt) + '  (' + fmtRelative(job.lastRunAt) + ')' : '—' },
      { k: 'Termine', v: job.lastFinishedAt ? fmtDate(job.lastFinishedAt) : '—' },
    ].forEach(function (t) {
      var w = el('div', { class: 'timing' });
      w.appendChild(el('div', { class: 'k', text: t.k }));
      w.appendChild(el('div', { class: 'v', text: t.v }));
      timings.appendChild(w);
    });
    c.appendChild(timings);

    if (job.failReason) {
      var err = el('div', { class: 'timing' });
      err.style.gridColumn = '1 / -1';
      err.appendChild(el('div', { class: 'k', text: 'Erreur' }));
      err.appendChild(el('div', { class: 'v', text: job.failReason }));
      timings.appendChild(err);
    }
    return c;
  }

  function renderStats(data) {
    dashboard.innerHTML = '';

    var ov = data.overview || {};
    var counts = ov.counts || {};
    var users = ov.users || {};

    // Overview
    var s1 = el('section');
    s1.appendChild(el('h2', { text: 'Vue d’ensemble' }));
    var g1 = el('div', { class: 'grid' });
    g1.appendChild(card('Utilisateurs', counts.users, fmt(users.withFcmToken) + ' avec push'));
    g1.appendChild(card('Jeux en base', counts.games));
    g1.appendChild(card('Abonnements', counts.gameSubscriptions));
    g1.appendChild(card('Wishlists', counts.wishlists));
    g1.appendChild(card('News tracked', counts.userNewsStates));
    g1.appendChild(card('Jeux suivis (total)', users.totalFollowedGames));
    s1.appendChild(g1);
    dashboard.appendChild(s1);

    // Follow modes
    var lib = users.libraryFollowMode || {};
    var wl = users.wishlistFollowMode || {};
    var s2 = el('section');
    s2.appendChild(el('h2', { text: 'Modes de suivi' }));
    var g2 = el('div', { class: 'grid' });
    ['off', 'auto', 'prompt'].forEach(function (m) {
      g2.appendChild(card('Library ' + m, lib[m] || 0));
    });
    ['off', 'auto', 'prompt'].forEach(function (m) {
      g2.appendChild(card('Wishlist ' + m, wl[m] || 0));
    });
    s2.appendChild(g2);
    dashboard.appendChild(s2);

    // Polling
    var pol = data.polling || {};
    var tiers = pol.tiers || {};
    var total = Object.values(tiers).reduce(function (a, b) { return a + (b || 0); }, 0);
    var s3 = el('section');
    s3.appendChild(el('h2', { text: 'Polling des news (' + fmt(pol.eligibleNow) + ' eligibles · ' + fmt(pol.pending) + ' en attente)' }));
    var box = el('div', { class: 'card' });
    var tiersWrap = el('div', { class: 'tiers' });
    ['hot', 'warm', 'cold', 'cold_no_news', 'never_checked'].forEach(function (name) {
      if (tiers[name] != null) tiersWrap.appendChild(tierRow(name, tiers[name], total));
    });
    box.appendChild(tiersWrap);
    s3.appendChild(box);
    dashboard.appendChild(s3);

    // Crons
    var crons = (data.crons && data.crons.jobs) || [];
    var s4 = el('section');
    s4.appendChild(el('h2', { text: 'Jobs planifies' }));
    var cw = el('div', { class: 'crons' });
    crons.forEach(function (j) { cw.appendChild(cronCard(j)); });
    if (!crons.length) {
      cw.appendChild(el('div', { class: 'loading', text: 'Aucun job initialise.' }));
    }
    s4.appendChild(cw);
    dashboard.appendChild(s4);

    // Meta footer
    var meta = data.meta || {};
    refreshMeta.textContent =
      'maj ' + new Date(meta.generatedAt || Date.now()).toLocaleTimeString('fr-FR') +
      ' · ' + (meta.durationMs || 0) + 'ms';
  }

  // ── Boot ──────────────────────────────────────────────────────────────────

  // Tentative silencieuse : si la session est deja valide on skip le login.
  fetch('/admin/stats/overview', { credentials: 'same-origin' })
    .then(function (r) {
      if (r.status === 204 || r.ok) showDashboard();
      else showLogin();
    })
    .catch(function () { showLogin(); });
})();
</script>
</body>
</html>
